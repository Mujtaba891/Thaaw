<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who's using THAAW?</title>
  <link rel="stylesheet" href="../ui/theme/tokens.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: var(--thaaw-font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      background: #0A0D14;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      user-select: none;
      -webkit-app-region: drag;
      overflow-y: auto;
    }
    .picker-container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      -webkit-app-region: no-drag;
    }
    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .brand-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #FFFFFF;
    }
    .brand-subtitle {
      font-size: 14px;
      color: #94A3B8;
      margin-bottom: 36px;
    }
    .profiles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      width: 100%;
      margin-bottom: 32px;
    }
    .profile-card {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      backdrop-filter: blur(12px);
    }
    .profile-card:hover {
      transform: translateY(-4px);
      background: rgba(30, 41, 59, 0.85);
      border-color: #38BDF8;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4), 0 0 0 1px #38BDF8;
    }
    .profile-card:active {
      transform: translateY(-1px);
    }
    .profile-card.active-profile {
      border-color: rgba(56, 189, 248, 0.6);
      background: rgba(56, 189, 248, 0.08);
    }
    .profile-avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.15);
      transition: transform 0.2s ease;
    }
    .profile-card:hover .profile-avatar {
      transform: scale(1.05);
    }
    .profile-name {
      font-size: 15px;
      font-weight: 600;
      color: #F8FAFC;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 130px;
    }
    .profile-meta {
      font-size: 12px;
      color: #94A3B8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 130px;
    }
    .active-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #0284C7;
      color: #FFFFFF;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .add-profile-card {
      border-style: dashed;
      background: rgba(15, 23, 42, 0.4);
    }
    .add-profile-card:hover {
      border-style: solid;
      background: rgba(30, 41, 59, 0.6);
    }
    .add-icon-wrap {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      color: #94A3B8;
      transition: all 0.2s ease;
    }
    .add-profile-card:hover .add-icon-wrap {
      background: #38BDF8;
      color: #0A0D14;
      border-color: #38BDF8;
    }
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      color: #94A3B8;
    }
    .guest-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #E2E8F0;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .guest-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.25);
    }
    .startup-checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .startup-checkbox-wrap input {
      cursor: pointer;
      accent-color: #38BDF8;
    }

    /* Add Profile Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      -webkit-app-region: no-drag;
    }
    .modal-card {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      text-align: left;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .modal-desc {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .input-label {
      font-size: 12px;
      font-weight: 500;
      color: #CBD5E1;
    }
    .input-field {
      background: #1F2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 10px 12px;
      color: #F9FAFB;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .input-field:focus {
      border-color: #38BDF8;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }
    .btn-cancel {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #E2E8F0;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-create {
      background: #0284C7;
      border: none;
      color: #FFFFFF;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .btn-create:hover {
      background: #0369A1;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="picker-container">
    <div class="brand-header">
      <img src="../../assets/icons/thaaw-icon.svg" width="34" height="34" alt="THAAW" style="display: block; filter: drop-shadow(0 2px 10px rgba(56, 189, 248, 0.4));" />
      <h1 class="brand-title">Who's using THAAW?</h1>
    </div>
    <p class="brand-subtitle">Choose a workspace profile to launch your isolated browsing session</p>

    <!-- Profiles Grid -->
    <div class="profiles-grid" id="profilesGrid">
      <!-- Populated dynamically -->
    </div>

    <!-- Bottom utility controls -->
    <div class="bottom-bar">
      <button type="button" class="guest-btn" id="guestBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 16v-4"></path>
          <path d="M12 8h.01"></path>
        </svg>
        Browse as Guest
      </button>

      <label class="startup-checkbox-wrap">
        <input type="checkbox" id="showOnStartupCheckbox" checked />
        <span>Show profile selector on startup</span>
      </label>
    </div>
  </div>

  <!-- Add Profile Modal -->
  <div class="modal-overlay hidden" id="addProfileModal">
    <div class="modal-card">
      <h2 class="modal-title">Create New Profile</h2>
      <p class="modal-desc">Add a separate browser environment with isolated cookies, history, and bookmarks.</p>
      
      <div class="input-group">
        <label class="input-label" for="newProfileName">Profile Name</label>
        <input type="text" id="newProfileName" class="input-field" placeholder="e.g., Client Work, Project Alpha" autocomplete="off" />
      </div>

      <div class="input-group">
        <label class="input-label" for="newProfileType">Workspace Preset</label>
        <select id="newProfileType" class="input-field">
          <option value="developer">Developer (Hardened with DevTools)</option>
          <option value="work">Work / Professional</option>
          <option value="personal">Personal / Leisure</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="cancelAddProfileBtn">Cancel</button>
        <button type="button" class="btn-create" id="confirmAddProfileBtn">Create & Launch</button>
      </div>
    </div>
  </div>

  <script>
    const profilesGrid = document.getElementById('profilesGrid');
    const guestBtn = document.getElementById('guestBtn');
    const showOnStartupCheckbox = document.getElementById('showOnStartupCheckbox');
    const addProfileModal = document.getElementById('addProfileModal');
    const cancelAddProfileBtn = document.getElementById('cancelAddProfileBtn');
    const confirmAddProfileBtn = document.getElementById('confirmAddProfileBtn');
    const newProfileName = document.getElementById('newProfileName');

    const defaultColors = {
      default: '#00D1FF',
      personal: '#00D1FF',
      work: '#10B981',
      developer: '#F59E0B',
      guest: '#94A3B8'
    };

    async function loadProfiles() {
      if (!window.thaawAPI?.listProfiles) return;
      try {
        const profiles = await window.thaawAPI.listProfiles();
        const active = window.thaawAPI.getActiveProfile ? await window.thaawAPI.getActiveProfile() : null;
        renderProfiles(profiles, active);
      } catch (err) {
        console.error('Failed to load profiles:', err);
      }
    }

    function renderProfiles(profiles, active) {
      profilesGrid.innerHTML = '';

      // Filter out private window ephemeral profile from selector
      const selectable = (Array.isArray(profiles) ? profiles : []).filter(p => p.id !== 'private' && p.id !== 'guest');

      selectable.forEach(profile => {
        const isCurrent = active && active.id === profile.id;
        const card = document.createElement('div');
        card.className = `profile-card ${isCurrent ? 'active-profile' : ''}`;
        card.dataset.profileId = profile.id;

        const color = profile.color || defaultColors[profile.id] || '#38BDF8';
        const initial = profile.name ? profile.name.charAt(0).toUpperCase() : 'P';

        let metaText = 'Isolated Profile';
        if (profile.id === 'default') metaText = 'Personal Workspace';
        else if (profile.id === 'work') metaText = 'Work & Team';
        else if (profile.id === 'developer') metaText = 'Developer Suite';

        card.innerHTML = `
          ${isCurrent ? '<span class="active-badge">Active</span>' : ''}
          <div class="profile-avatar" style="background: ${color};">
            ${initial}
          </div>
          <div class="profile-name" title="${profile.name}">${profile.name}</div>
          <div class="profile-meta">${profile.email || metaText}</div>
        `;

        card.addEventListener('click', () => {
          selectAndLaunch(profile.id);
        });

        profilesGrid.appendChild(card);
      });

      // Add "Add Profile" Card
      const addCard = document.createElement('div');
      addCard.className = 'profile-card add-profile-card';
      addCard.innerHTML = `
        <div class="add-icon-wrap">
          <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
        <div class="profile-name">Add Profile</div>
        <div class="profile-meta">New Workspace</div>
      `;
      addCard.addEventListener('click', () => {
        addProfileModal.classList.remove('hidden');
        newProfileName.value = '';
        newProfileName.focus();
      });
      profilesGrid.appendChild(addCard);
    }

    async function selectAndLaunch(profileId) {
      if (window.thaawAPI?.selectProfileAndLaunch) {
        await window.thaawAPI.selectProfileAndLaunch(profileId);
      }
    }

    guestBtn.addEventListener('click', () => {
      selectAndLaunch('guest');
    });

    showOnStartupCheckbox.addEventListener('change', () => {
      if (window.thaawAPI?.setStartupPickerPreference) {
        window.thaawAPI.setStartupPickerPreference(showOnStartupCheckbox.checked);
      }
    });

    cancelAddProfileBtn.addEventListener('click', () => {
      addProfileModal.classList.add('hidden');
    });

    confirmAddProfileBtn.addEventListener('click', async () => {
      const name = newProfileName.value.trim();
      if (!name) return;
      if (window.thaawAPI?.createProfile) {
        const newProf = await window.thaawAPI.createProfile(name);
        addProfileModal.classList.add('hidden');
        if (newProf && newProf.id) {
          selectAndLaunch(newProf.id);
        } else {
          loadProfiles();
        }
      }
    });

    function initPicker() {
      loadProfiles();
      if (window.thaawAPI?.getStartupPickerPreference) {
        window.thaawAPI.getStartupPickerPreference().then(val => {
          showOnStartupCheckbox.checked = !!val;
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPicker);
    } else {
      initPicker();
    }
  </script>
</body>
</html>
