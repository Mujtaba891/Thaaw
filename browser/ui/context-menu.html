<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Menu</title>
  <link rel="stylesheet" href="theme/tokens.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 4px;
    }

    .menu-container {
      background: rgba(13, 17, 23, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 5px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 229, 255, 0.1);
      display: flex;
      flex-direction: column;
      animation: menuFadeIn 0.12s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes menuFadeIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(-2px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12.5px;
      color: #E6EDF3;
      cursor: pointer;
      transition: background 0.1s ease, color 0.1s ease;
      outline: none;
    }

    .menu-item:hover,
    .menu-item.active {
      background: rgba(0, 229, 255, 0.12);
      color: #00E5FF;
    }

    .menu-item.disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }

    .menu-item-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .menu-icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 450;
    }

    .menu-shortcut {
      font-size: 10.5px;
      color: #8B949E;
      margin-left: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding-left: 12px;
    }

    .menu-item:hover .menu-shortcut,
    .menu-item.active .menu-shortcut {
      color: rgba(0, 229, 255, 0.8);
    }

    .menu-separator {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 4px 6px;
    }
  </style>
</head>
<body>
  <div id="menuContainer" class="menu-container">
    <!-- Populated dynamically by renderer/preload -->
  </div>

  <script>
    const container = document.getElementById('menuContainer');
    let currentItems = [];
    let selectedIndex = -1;

    // SVG icon registry
    const ICONS = {
      'arrow-left': '<line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>',
      'arrow-right': '<line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>',
      'refresh': '<polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>',
      'external-link': '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line>',
      'window': '<rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line>',
      'copy': '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>',
      'download': '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line>',
      'image': '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline>',
      'play': '<polygon points="5 3 19 12 5 21 5 3"></polygon>',
      'shield-ban': '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line>',
      'code': '<polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline>',
      'undo': '<path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>',
      'redo': '<path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path>',
      'cut': '<circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line>',
      'clipboard': '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>',
      'select': '<rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 3"></rect>',
      'search': '<circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>',
      'globe': '<circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>',
      'printer': '<polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect>',
      'qr-code': '<rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>',
      'plus': '<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>',
      'pin': '<line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-2l-2-2V5h1V3H6v2h1v8l-2 2v2z"></path>',
      'volume-x': '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>',
      'x': '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
      'trash': '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>',
      'maximize': '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>',
      'moon': '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>',
      'history': '<circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>',
      'user': '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>',
      'edit': '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>',
      'settings': '<circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>'
    };

    function renderMenu(items) {
      container.innerHTML = '';
      currentItems = items;
      selectedIndex = -1;

      items.forEach((item, index) => {
        if (item.type === 'separator') {
          const sep = document.createElement('div');
          sep.className = 'menu-separator';
          container.appendChild(sep);
          return;
        }

        const div = document.createElement('div');
        div.className = 'menu-item' + (item.disabled ? ' disabled' : '');
        div.tabIndex = 0;
        div.dataset.index = index;
        div.dataset.id = item.id;

        const left = document.createElement('div');
        left.className = 'menu-item-left';

        if (item.icon && ICONS[item.icon]) {
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('viewBox', '0 0 24 24');
          svg.setAttribute('class', 'menu-icon');
          svg.innerHTML = ICONS[item.icon];
          left.appendChild(svg);
        }

        const label = document.createElement('span');
        label.className = 'menu-label';
        label.textContent = item.label;
        left.appendChild(label);

        div.appendChild(left);

        if (item.shortcut) {
          const shortcut = document.createElement('span');
          shortcut.className = 'menu-shortcut';
          shortcut.textContent = item.shortcut;
          div.appendChild(shortcut);
        }

        div.addEventListener('click', () => {
          if (!item.disabled && window.contextMenuAPI) {
            window.contextMenuAPI.selectAction(item.id);
          }
        });

        div.addEventListener('mouseenter', () => {
          setSelectedIndex(index);
        });

        container.appendChild(div);
      });

      // Send calculated height back to main process to resize window accurately
      requestAnimationFrame(() => {
        const height = container.offsetHeight + 8;
        const width = container.offsetWidth + 8;
        if (window.contextMenuAPI) {
          window.contextMenuAPI.resize(width, height);
        }
      });
    }

    function setSelectedIndex(idx) {
      const domItems = container.querySelectorAll('.menu-item');
      domItems.forEach(el => el.classList.remove('active'));
      selectedIndex = idx;
      const target = container.querySelector(`.menu-item[data-index="${idx}"]`);
      if (target && !target.classList.contains('disabled')) {
        target.classList.add('active');
        target.scrollIntoView({ block: 'nearest' });
      }
    }

    document.addEventListener('keydown', (e) => {
      const actionable = currentItems
        .map((it, idx) => ({ ...it, index: idx }))
        .filter(it => it.type !== 'separator' && !it.disabled);

      if (actionable.length === 0) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        const curIdx = actionable.findIndex(a => a.index === selectedIndex);
        const next = curIdx + 1 >= actionable.length ? 0 : curIdx + 1;
        setSelectedIndex(actionable[next].index);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        const curIdx = actionable.findIndex(a => a.index === selectedIndex);
        const prev = curIdx <= 0 ? actionable.length - 1 : curIdx - 1;
        setSelectedIndex(actionable[prev].index);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (selectedIndex >= 0 && currentItems[selectedIndex] && !currentItems[selectedIndex].disabled) {
          window.contextMenuAPI?.selectAction(currentItems[selectedIndex].id);
        }
      } else if (e.key === 'Escape') {
        e.preventDefault();
        window.contextMenuAPI?.close();
      }
    });

    if (window.contextMenuAPI) {
      window.contextMenuAPI.onSetItems((items) => {
        renderMenu(items);
      });
    }
  </script>
</body>
</html>
